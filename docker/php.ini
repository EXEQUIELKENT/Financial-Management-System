; Production PHP settings for the container image.
; Loaded from /usr/local/etc/php/conf.d/ so it overrides the stock php.ini-production.

; --- Error handling ---------------------------------------------------------
; Never render errors into a response; ship them to the container log instead,
; where the platform's log viewer can pick them up.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Limits -----------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 16M
post_max_size = 16M
max_input_vars = 3000

; --- Sessions ---------------------------------------------------------------
session.save_path = "/var/www/sessions"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1800
session.sid_length = 48
session.sid_bits_per_character = 5

; --- Hardening --------------------------------------------------------------
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

; --- Performance ------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Application code is baked into the image and never changes at runtime, so skip
; the per-request mtime check entirely. A new deploy is a new container.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

date.timezone = "Asia/Manila"
