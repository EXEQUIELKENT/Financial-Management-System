# Apache virtual host for the Financial Management System container.
# The listen port is rewritten at container start from $PORT (see docker/entrypoint.sh),
# which is why the literal below is only a default.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Directories that must never be served over HTTP: raw SQL (schema + demo data
    # generator), server-side includes, and the DB credentials in config/.
    <DirectoryMatch "^/var/www/html/(sql|includes|config|docker|scripts|vendor)/">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^(composer\.(json|lock)|\.env.*|Dockerfile|\.php-version|\.gitattributes)$">
        Require all denied
    </FilesMatch>

    # The platform terminates TLS and proxies to this container, so REMOTE_ADDR would
    # otherwise be the proxy's address on every request -- which would make the audit
    # log's IP column useless. Trust the forwarded header only from private ranges, so
    # an outside client cannot forge its own address.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16
    RemoteIPTrustedProxy 127.0.0.0/8

    # Log the real client IP (%a comes from mod_remoteip) rather than the proxy's.
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
    ErrorLog /dev/stderr

    # Health probes fire every few seconds; keeping them out of the access log leaves
    # it readable. Everything else is logged.
    SetEnvIf Request_URI "^/health(\.php)?$" dontlog
    CustomLog /dev/stdout proxied env=!dontlog

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always unset X-Powered-By
    </IfModule>
</VirtualHost>
